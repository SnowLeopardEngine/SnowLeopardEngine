name: Build Windows

on:
  push:
    branches: [ main, dev, dev-next ]
  pull_request:
    branches: [ main, dev, dev-next ]

jobs:
  build:
    env:
      XMAKE_ACTION_BUILD_CACHE: true # xmake's build cache (build/.build_cache), as the setup action enabled it
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [ debug, release ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'windows-${{ matrix.mode }}'

      # Caches (instead of the action's package / build caches, whose keys are a hash of every dependency: one changed
      # package threw everything away, and nothing was saved after a failed job):
      #   packages: keyed by the build scripts and recipes, restored from the closest earlier key when they change
      #   build cache (compiled objects): one entry per run, restored from the latest one
      # Both are saved even when a later step fails, so the next run starts from what was installed / compiled.
      - name: Restore xmake packages
        id: packages
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\.xmake\packages
          key: xmake-packages-windows-${{ matrix.mode }}-${{ hashFiles('xmake.lua', '**/xmake.lua', 'xmake/packages/**') }}
          restore-keys: xmake-packages-windows-${{ matrix.mode }}-

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: build/.build_cache
          key: xmake-build-windows-${{ matrix.mode }}-${{ github.run_id }}
          restore-keys: xmake-build-windows-${{ matrix.mode }}-

      - name: Build C# bindings
        shell: pwsh
        run: ./Source/CSharpBindings/build.ps1

      # Package downloads from GitHub fail now and then (tinygltf did, tarball and clone): retry the install.
      - name: Configure
        shell: pwsh
        run: |
          xmake repo -u
          foreach ($attempt in 1..3) {
            # verbose after the first failure: the package's own error, not only "install .. failed"
            if ($attempt -eq 1) { xmake f -m ${{ matrix.mode }} -y } else { xmake f -m ${{ matrix.mode }} -y -vD }
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "package install failed (attempt $attempt), retrying"
            Start-Sleep -Seconds 20
          }
          exit 1

      # A package that fails to install keeps its full log on the runner only: print it.
      - name: Package install logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:LOCALAPPDATA\.xmake\cache\packages" -Recurse -Filter install.txt -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like '*installdir.failed*' } |
            ForEach-Object { Write-Host "::group::$($_.FullName)"; Get-Content $_.FullName -Tail 150; Write-Host "::endgroup::" }

      - name: Build
        run: xmake -y

      # Engine tests need a Vulkan GPU, which hosted runners do not have; the Jolt library test is headless.
      - name: Test
        run: xmake run JoltPhysics_Test

      - name: Save xmake packages
        if: always() && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\.xmake\packages
          key: ${{ steps.packages.outputs.cache-primary-key }}

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/.build_cache
          key: xmake-build-windows-${{ matrix.mode }}-${{ github.run_id }}
