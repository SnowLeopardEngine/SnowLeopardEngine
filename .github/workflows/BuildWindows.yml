name: Build Windows

on:
  push:
    branches: [ main, dev, dev-next ]
  pull_request:
    branches: [ main, dev, dev-next ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [ debug, release ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'windows-${{ matrix.mode }}'
          package-cache: true
          package-cache-key: 'windows-${{ matrix.mode }}'
          build-cache: true
          build-cache-key: 'windows-${{ matrix.mode }}'

      - name: Build C# bindings
        shell: pwsh
        run: ./Source/CSharpBindings/build.ps1

      # Package downloads from GitHub fail now and then (tinygltf did, tarball and clone): retry the install.
      - name: Configure
        shell: pwsh
        run: |
          xmake repo -u
          foreach ($attempt in 1..3) {
            # verbose after the first failure: the package's own error, not only "install .. failed"
            if ($attempt -eq 1) { xmake f -m ${{ matrix.mode }} -y } else { xmake f -m ${{ matrix.mode }} -y -vD }
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "package install failed (attempt $attempt), retrying"
            Start-Sleep -Seconds 20
          }
          exit 1

      # A package that fails to install keeps its full log on the runner only: print it.
      - name: Package install logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:LOCALAPPDATA\.xmake\cache\packages" -Recurse -Filter install.txt -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like '*installdir.failed*' } |
            ForEach-Object { Write-Host "::group::$($_.FullName)"; Get-Content $_.FullName -Tail 150; Write-Host "::endgroup::" }

      - name: Build
        run: xmake -y

      # Engine tests need a Vulkan GPU, which hosted runners do not have; the Jolt library test is headless.
      - name: Test
        run: xmake run JoltPhysics_Test
