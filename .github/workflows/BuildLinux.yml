name: Build Linux

on:
  push:
    branches: [ main, dev, dev-next ]
  pull_request:
    branches: [ main, dev, dev-next ]

jobs:
  build:
    env:
      XMAKE_ACTION_BUILD_CACHE: true # xmake's build cache (build/.build_cache), as the setup action enabled it
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [ debug, release ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'linux-${{ matrix.mode }}'

      # Caches (instead of the action's package / build caches, whose keys are a hash of every dependency: one changed
      # package threw everything away, and nothing was saved after a failed job):
      #   packages: keyed by the build scripts and recipes, restored from the closest earlier key when they change
      #   build cache (compiled objects): one entry per run, restored from the latest one
      # Both are saved even when a later step fails, so the next run starts from what was installed / compiled.
      - name: Restore xmake packages
        id: packages
        uses: actions/cache/restore@v4
        with:
          path: ~/.xmake/packages
          key: xmake-packages-linux-${{ matrix.mode }}-${{ hashFiles('xmake.lua', '**/xmake.lua', 'xmake/packages/**') }}
          restore-keys: xmake-packages-linux-${{ matrix.mode }}-

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: build/.build_cache
          key: xmake-build-linux-${{ matrix.mode }}-${{ github.run_id }}
          restore-keys: xmake-build-linux-${{ matrix.mode }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # SDL3 (built from source by xmake) needs the X11 / Wayland / GL / audio development headers
          sudo apt-get install -y build-essential cmake git clang pkg-config libx11-dev libxext-dev libxrandr-dev             libxrender-dev libxinerama-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev             libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev             libglvnd-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Build C# bindings
        run: bash ./Source/CSharpBindings/build.sh

      # Package downloads from GitHub fail now and then (tinygltf did, tarball and clone): retry the install.
      - name: Configure
        run: |
          xmake repo -u
          for attempt in 1 2 3; do
            # verbose after the first failure: the package's own error, not only "install .. failed"
            if [ $attempt -eq 1 ]; then flags=""; else flags="-vD"; fi
            xmake f -m ${{ matrix.mode }} -y $flags && exit 0
            echo "package install failed (attempt $attempt), retrying"
            sleep 20
          done
          exit 1

      # A package that fails to install keeps its full log on the runner only: print it.
      - name: Package install logs
        if: failure()
        run: |
          find ~/.xmake/cache/packages -path '*installdir.failed*' -name install.txt 2>/dev/null |
            while read -r log; do echo "::group::$log"; tail -n 150 "$log"; echo "::endgroup::"; done

      - name: Build
        run: xmake -y

      # Engine tests need a Vulkan GPU, which hosted runners do not have; the Jolt library test is headless.
      - name: Test
        run: xmake run JoltPhysics_Test

      - name: Save xmake packages
        if: always() && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.xmake/packages
          key: ${{ steps.packages.outputs.cache-primary-key }}

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/.build_cache
          key: xmake-build-linux-${{ matrix.mode }}-${{ github.run_id }}
