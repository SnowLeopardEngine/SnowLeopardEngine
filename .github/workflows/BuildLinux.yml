name: Build Linux

on:
  push:
    branches: [ main, dev, dev-next ]
  pull_request:
    branches: [ main, dev, dev-next ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [ debug, release ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'linux-${{ matrix.mode }}'
          package-cache: true
          package-cache-key: 'linux-${{ matrix.mode }}'
          build-cache: true
          build-cache-key: 'linux-${{ matrix.mode }}'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # SDL3 (built from source by xmake) needs the X11 / Wayland / GL / audio development headers
          sudo apt-get install -y build-essential cmake git clang pkg-config libx11-dev libxext-dev libxrandr-dev             libxrender-dev libxinerama-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev             libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev             libglvnd-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Build C# bindings
        run: bash ./Source/CSharpBindings/build.sh

      - name: Configure
        run: |
          xmake repo -u
          xmake f -m ${{ matrix.mode }} -y

      - name: Build
        run: xmake -y

      # Engine tests need an OpenGL window, which hosted runners do not have; the Jolt library test is headless.
      - name: Test
        run: xmake run JoltPhysics_Test
